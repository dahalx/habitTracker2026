
name: notion_habit_tracker
description: "Notion-Style Habit Tracker & Obsidian Vault Exporter with Hive local-first storage."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Local-first embedded NoSQL database engine (sandboxed, fast, zero network)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Interactive Obsidian vault folder picker
  file_picker: ^8.1.7

  # Local device internal path isolation
  path_provider: ^2.1.5

  # Date formatting & internationalization
  intl: ^0.20.2

  # Notion-style calendar & table views
  table_calendar: ^3.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
