
name: notion_habit_tracker
description: "A production-grade, air-gapped Notion Habit Tracker & Journal for Android phone."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Local SQLite database engine for Android sandbox storage
  sqflite: ^2.4.1
  
  # Cross-platform file system path manipulation
  path: ^1.9.0
  
  # Path provider for locating internal sandbox storage
  path_provider: ^2.1.5
  
  # Date formatting & internationalization
  intl: ^0.20.2
  
  # Material & Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
